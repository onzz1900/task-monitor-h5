services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: tms
      MYSQL_USER: tms
      MYSQL_PASSWORD: tmsdemo
      MYSQL_ROOT_PASSWORD: tmsdemo
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-utms", "-ptmsdemo"]
      interval: 3s
      timeout: 5s
      retries: 30
    volumes:
      - tms-mysql:/var/lib/mysql

  migrate:
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: mysql://tms:tmsdemo@mysql:3306/tms
      BETTER_AUTH_URL: http://localhost:3000
    depends_on:
      mysql:
        condition: service_healthy
    command: ["sh", "-c", "npm install && npm run db:setup"]

volumes:
  tms-mysql:
