<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Command · Northline Partners</title>
    <meta
      name="description"
      content="Northline Partners internal command dashboard for meetings, follow-ups, and transfers."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23070908' width='32' height='32'/%3E%3Crect x='3' y='3' width='26' height='26' fill='none' stroke='%23d4b04a'/%3E%3Ctext x='16' y='22' text-anchor='middle' fill='%23f3d98a' font-size='16' font-family='Georgia'%3EN%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>

    <header class="mast">
      <div class="mast-brand">
        <span class="mark" aria-hidden="true">N</span>
        <div>
          <p class="eyebrow">Northline Partners · Internal</p>
          <h1>Command</h1>
        </div>
      </div>
      <p class="mast-scope">
        Meetings, follow-ups, and ownership transfers
        <span>Operations floor · San Francisco</span>
      </p>
      <div class="mast-clock">
        <time id="live-clock">00:00:00</time>
        <p id="live-date">Tuesday 18 August 2026</p>
      </div>
    </header>

    <main class="deck">
      <section class="intel" aria-label="Meeting statistics and transfer tape">
        <div class="strip" id="strip" aria-label="Compact meeting statistics"></div>
        <div class="mosaic" id="mosaic"></div>
        <section class="tape" aria-label="Upcoming transfers">
          <div class="tape-head">
            <h2>Upcoming transfers</h2>
            <p id="tape-caption">Today’s handoff window</p>
          </div>
          <div class="tape-scroll">
            <div class="tape-track" id="tape-track"></div>
          </div>
        </section>
      </section>

      <section class="rail" aria-label="Task rail">
        <div class="rail-head">
          <div>
            <p class="eyebrow">Active rail</p>
            <h2>Work in motion</h2>
          </div>
          <p class="rail-count" id="rail-count">0 items</p>
        </div>
        <div class="filters" id="filters" role="tablist" aria-label="Filter tasks"></div>
        <ol class="tasks" id="tasks"></ol>
      </section>
    </main>

    <aside class="brief" id="brief" hidden>
      <div class="brief-panel" role="dialog" aria-modal="true" aria-labelledby="brief-title">
        <button class="brief-close" id="brief-close" type="button" aria-label="Close briefing">
          Close
        </button>
        <div id="brief-body"></div>
      </div>
    </aside>

    <script src="./app.js"></script>
  </body>
</html>
