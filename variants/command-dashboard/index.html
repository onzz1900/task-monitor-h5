<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>指挥舱 · 北辰集团</title>
    <meta
      name="description"
      content="北辰集团内部任务指挥舱，用于会议、跟进与权责流转。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400;500&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23070908' width='32' height='32'/%3E%3Crect x='3' y='3' width='26' height='26' fill='none' stroke='%23d4b04a'/%3E%3Ctext x='16' y='22' text-anchor='middle' fill='%23f3d98a' font-size='14' font-family='Georgia'%3E%E5%8C%97%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>

    <header class="mast">
      <div class="mast-brand">
        <span class="mark" aria-hidden="true">北</span>
        <div>
          <p class="eyebrow">北辰集团 · 内部</p>
          <h1>指挥舱</h1>
        </div>
      </div>
      <p class="mast-scope">
        会议、跟进与权责流转
        <span>运营现场 · 上海</span>
      </p>
      <div class="mast-clock">
        <time id="live-clock">00:00:00</time>
        <p id="live-date">2026年8月18日 星期二</p>
      </div>
    </header>

    <main class="deck">
      <section class="intel" aria-label="会议统计与流转时间轴">
        <div class="strip" id="strip" aria-label="会议统计速览"></div>
        <div class="mosaic" id="mosaic"></div>
        <section class="tape" aria-label="即将流转">
          <div class="tape-head">
            <h2>即将流转</h2>
            <p id="tape-caption">今日交接窗口</p>
          </div>
          <div class="tape-scroll">
            <div class="tape-track" id="tape-track"></div>
          </div>
        </section>
      </section>

      <section class="rail" aria-label="任务轨道">
        <div class="rail-head">
          <div>
            <p class="eyebrow">在办轨道</p>
            <h2>正在推进</h2>
          </div>
          <p class="rail-count" id="rail-count">0 项</p>
        </div>
        <div class="filters" id="filters" role="tablist" aria-label="筛选任务"></div>
        <ol class="tasks" id="tasks"></ol>
      </section>
    </main>

    <aside class="brief" id="brief" hidden>
      <div class="brief-panel" role="dialog" aria-modal="true" aria-labelledby="brief-title">
        <button class="brief-close" id="brief-close" type="button" aria-label="关闭简报">
          关闭
        </button>
        <div id="brief-body"></div>
      </div>
    </aside>

    <script src="./app.js"></script>
  </body>
</html>
