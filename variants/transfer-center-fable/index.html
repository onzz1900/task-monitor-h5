<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("tcf-theme");
          if (theme === "light" || theme === "dark") {
            document.documentElement.setAttribute("data-theme", theme);
          }
        } catch (err) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>任务流转中心</title>
    <meta
      name="description"
      content="任务流转中心 / Mission Transfer Center：电商采集、监控与报表任务的流转看板（备选视觉方案）。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700;900&family=Spline+Sans+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23e0592a'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-size='13' font-family='serif' fill='%23fdf8ef'%3E流%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-seal" aria-hidden="true">流</span>
          <span class="brand-text">
            <strong>任务流转中心</strong>
            <small>Mission Transfer Center</small>
          </span>
        </div>
        <div class="topbar-clock" id="clock" aria-label="当前时间"></div>
        <nav class="ver-switch" aria-label="版本切换">
          <span class="ver-current" title="当前版本">纸票版</span>
          <a href="/variants/ops-console/" title="切换到控制台版">控制台版</a>
        </nav>
        <div class="theme-toggle" role="group" aria-label="主题切换">
          <button type="button" data-theme-set="light" aria-label="切换到浅色主题">
            <span class="tt-icon" aria-hidden="true">☀</span>浅色
          </button>
          <button type="button" data-theme-set="dark" aria-label="切换到深色主题">
            <span class="tt-icon" aria-hidden="true">☾</span>深色
          </button>
        </div>
      </div>
    </header>

    <main class="page">
      <section class="hero">
        <p class="hero-kicker" id="hero-kicker"></p>
        <h1 class="hero-title">今天的任务在谁手上，<br class="only-sm" />什么时候流到下一手。</h1>
      </section>

      <section class="stats" id="stats" aria-label="流转统计"></section>

      <section class="list-head">
        <h2 class="list-title">任务清单</h2>
        <div class="chips" id="chips" role="tablist" aria-label="按状态筛选"></div>
      </section>

      <section class="ticket-list" id="ticket-list" aria-label="任务列表"></section>
      <p class="empty" id="empty" hidden>该筛选条件下暂无任务。</p>

      <footer class="page-foot">
        示例数据 · 时间基准 <span id="foot-now"></span> · 华东零售电商运营
      </footer>
    </main>

    <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
    <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></aside>

    <script src="./data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
