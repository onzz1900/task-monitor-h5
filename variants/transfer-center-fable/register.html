<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("tcf-theme");
          if (theme === "light" || theme === "dark") {
            document.documentElement.setAttribute("data-theme", theme);
          }
        } catch (err) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>任务登记中心 · 任务流转中心</title>
    <meta
      name="description"
      content="任务登记中心：登记与配置采集 / 监控 / 报表任务，含调度（cron / 间隔，Asia/Shanghai）与回调（secretRef）。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700;900&family=Spline+Sans+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23e0592a'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-size='13' font-family='serif' fill='%23fdf8ef'%3E登%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="./index.html" title="返回看板">
          <span class="brand-seal" aria-hidden="true">登</span>
          <span class="brand-text">
            <strong>任务登记中心</strong>
            <small>任务流转中心 · Registry</small>
          </span>
        </a>
        <nav class="ver-switch" aria-label="页面切换">
          <a href="./index.html">看板</a>
          <span class="ver-current">任务登记</span>
        </nav>
        <div class="theme-toggle" role="group" aria-label="主题切换" style="margin-left:auto">
          <button type="button" data-theme-set="light" aria-label="切换到浅色主题">
            <span class="tt-icon" aria-hidden="true">☀</span>浅色
          </button>
          <button type="button" data-theme-set="dark" aria-label="切换到深色主题">
            <span class="tt-icon" aria-hidden="true">☾</span>深色
          </button>
        </div>
      </div>
    </header>

    <main class="page">
      <section class="hero">
        <p class="hero-kicker">采集 / 监控 / 报表 · 调度与回调在此登记</p>
        <h1 class="hero-title">登记一个任务，<br class="only-sm" />说清它什么时候跑、跑完通知谁。</h1>
      </section>

      <section class="list-head">
        <h2 class="list-title">已登记任务</h2>
        <span class="reg-count" id="reg-count"></span>
        <span style="flex:1"></span>
        <button type="button" class="btn-plain" id="reg-reset" title="清除本地修改，恢复种子数据">重置演示数据</button>
        <button type="button" class="btn-primary" id="reg-new">＋ 登记任务</button>
      </section>

      <section class="ticket-list" id="reg-list" aria-label="已登记任务"></section>

      <footer class="page-foot">
        登记数据保存在浏览器 localStorage（键 <span class="mono">tcf-registry-v1</span>）· 数据模型见本目录 README
      </footer>
    </main>

    <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
    <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></aside>

    <script src="./registry-data.js"></script>
    <script src="./registry.js"></script>
  </body>
</html>
